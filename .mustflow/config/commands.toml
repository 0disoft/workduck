schema_version = "1"

[intents.delivery_status]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Inspect local delivery identity, remote main and v1.9.0 tag, CI runs and published releases without mutations."
argv = ["node", "--input-type=module", "-e", '''
import {spawnSync} from 'node:child_process';
for(const [cmd,args] of [
 ['git',['status','--short','--branch']],['git',['log','-7','--oneline']],
 ['git',['ls-remote','origin','refs/heads/main','refs/tags/v1.9.0','refs/tags/v1.9.0^{}']],
]) {const r=spawnSync(cmd,args,{encoding:'utf8',shell:false,timeout:45000}); console.log(JSON.stringify({command:[cmd,...args],status:r.status,output:r.stdout,error:r.stderr})); if(r.status!==0) process.exit(r.status??1);}
for(const path of ['actions/runs?per_page=6','releases?per_page=2']) {
 const r=await fetch('https://api.github.com/repos/0disoft/workduck/'+path,{signal:AbortSignal.timeout(30000)}); if(!r.ok) throw Error('GitHub HTTP '+r.status); const data=await r.json();
 console.log(JSON.stringify(path.startsWith('actions') ? data.workflow_runs.map(x=>({id:x.id,name:x.name,sha:x.head_sha,status:x.status,conclusion:x.conclusion,url:x.html_url})) : data.map(x=>({tag:x.tag_name,draft:x.draft,url:x.html_url,assets:x.assets.map(a=>({name:a.name,size:a.size,url:a.browser_download_url}))})));
}
''']
cwd = "."
timeout_seconds = 240
stdin = "closed"
success_exit_codes = [0]
max_output_bytes = 32768
writes = []
network = true
destructive = false
approval_actions = ["network_access"]

