git(['add', '--', ...paths]);
const actual = git(['diff', '--cached', '--name-only']).split(/\r?\n/).sort();
if (JSON.stringify(actual) !== JSON.stringify(paths)) throw new Error('Unexpected staged paths');
git(['diff', '--cached', '--check']);
console.log(git(['commit', '-m', '🐛 fix(projects): preserve card heights in scrolling lists', '-m', 'Size vertical grid rows to their content so crowded project lists do not overlap. Synchronize patch version metadata.\n\nValidation: frontend checks passed; native visual verification remains pending.']));
''']
