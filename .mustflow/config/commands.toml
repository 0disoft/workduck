[intents.brief_navigation_audit]
status = "configured"
lifecycle = "oneshot"
run_policy = "agent_allowed"
description = "Review LLMNav coverage candidates after the Brief route and storage allowlist changes."
argv = ["node", "--input-type=module", "-e", '''
import { spawnSync } from 'node:child_process';
const r = spawnSync(process.execPath, ['node_modules/llmnav/bin/llmnav.js', 'audit', '--json'], { encoding: 'utf8', shell: false, timeout: 90000, maxBuffer: 2097152 });
if (r.status !== 0) throw new Error(r.stderr || 'Navigation audit failed');
const report = JSON.parse(r.stdout);
console.log(JSON.stringify({summary: report.summary, candidates: report.candidates.filter(c => c.priority !== 'low').map(({path, priority, reasons}) => ({path, priority, reasons}))}));
''']
cwd = "."
timeout_seconds = 120
stdin = "closed"
success_exit_codes = [0]
max_output_bytes = 65536
