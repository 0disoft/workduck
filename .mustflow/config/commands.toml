const paths = [
  '.mustflow/config/commands.toml','README.md','ROADMAP.md','package.json','src-tauri/Cargo.toml','src-tauri/Cargo.lock',
  ...['BriefRunsPanel.svelte','brief-gate.ts','brief-gate-messages.ts','brief-run-evidence.ts','brief-run.test.ts','briefs.css'].map(f => 'src/lib/briefs/'+f),
