[package]
name = "workduck"
version = "1.0.10"
description = "Local-first developer workbench"
authors = ["Workduck contributors"]
edition = "2021"

[lib]
name = "workduck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
