name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Windows desktop
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (2026-02-13)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: windows-ci
          workspaces: |
            src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source, tests, and frontend build
        run: bun run verify

      - name: Verify release source archive and CLI
        shell: pwsh
        run: >-
          ./scripts/verify-source-archive.ps1
          -OutputPath dist/source-smoke/workduck-source.zip
          -ExtractPath dist/source-smoke/extracted
