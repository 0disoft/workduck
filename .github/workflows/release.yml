name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, for example v1.3.9."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $env:RELEASE_INPUT_TAG.Trim()
          } else {
            $env:RELEASE_REF_NAME.Trim()
          }

          if ($tag -notmatch '^v\d+\.\d+\.\d+([-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a semantic version tag such as v1.3.9. Received: $tag"
          }

          $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
          $expectedVersion = $tag -replace '^v', ''
          if ($package.version -ne $expectedVersion) {
            throw "package.json version $($package.version) does not match release tag $tag."
          }

          $cargoPackageName = $null
          $cargoPackageVersion = $null
          $inCargoPackageSection = $false
          foreach ($line in Get-Content -LiteralPath src-tauri/Cargo.toml) {
            $trimmedLine = $line.Trim()
            if ($trimmedLine -eq "[package]") {
              $inCargoPackageSection = $true
              continue
            }
            if ($inCargoPackageSection -and $trimmedLine.StartsWith("[")) {
              break
            }
            if ($inCargoPackageSection -and $trimmedLine -match '^name\s*=\s*"([^"]+)"') {
              $cargoPackageName = $Matches[1]
            }
            if ($inCargoPackageSection -and $trimmedLine -match '^version\s*=\s*"([^"]+)"') {
              $cargoPackageVersion = $Matches[1]
            }
          }
          if ($cargoPackageName -ne "workduck") {
            throw "src-tauri/Cargo.toml package name must be workduck."
          }
          if ($cargoPackageVersion -ne $expectedVersion) {
            throw "src-tauri/Cargo.toml version $cargoPackageVersion does not match release tag $tag."
          }

          $cargoLock = Get-Content -Raw -LiteralPath src-tauri/Cargo.lock
          $workduckLockPackage = [regex]::Match(
            $cargoLock,
            '(?ms)^\[\[package\]\]\s+name\s*=\s*"workduck"\s+version\s*=\s*"([^"]+)"'
          )
          if (!$workduckLockPackage.Success) {
            throw "src-tauri/Cargo.lock does not contain the workduck package entry."
          }
          if ($workduckLockPackage.Groups[1].Value -ne $expectedVersion) {
            throw "src-tauri/Cargo.lock workduck version $($workduckLockPackage.Groups[1].Value) does not match release tag $tag."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Resolve signing mode
        id: signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)

          if ($hasCertificate -xor $hasPassword) {
            throw "Set both WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD, or leave both empty for an unsigned release."
          }

          if ($hasCertificate -and $hasPassword) {
            "enabled=true" >> $env:GITHUB_OUTPUT
            "Windows code signing is enabled for this release."
          } else {
            "enabled=false" >> $env:GITHUB_OUTPUT
            "Windows code signing secrets are not configured. Building an unsigned installer."
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache Bun package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable (2026-02-13)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: windows-release
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript and Svelte
        run: bun run check

      - name: Test frontend and shared packages
        run: bun run test

      - name: Test Rust crate
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Import Windows signing certificate
        if: steps.signing.outputs.enabled == 'true'
        id: import_windows_cert
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "workduck-code-signing.pfx"
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password

          if ($null -eq $cert -or [string]::IsNullOrWhiteSpace($cert.Thumbprint)) {
            throw "Windows signing certificate import failed."
          }

          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Prepare Tauri signing config
        if: steps.signing.outputs.enabled == 'true'
        id: signing_config
        shell: pwsh
        env:
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            "http://timestamp.digicert.com"
          } else {
            $env:WINDOWS_TIMESTAMP_URL.Trim()
          }

          $signingConfig = [ordered]@{
            bundle = [ordered]@{
              windows = [ordered]@{
                certificateThumbprint = "${{ steps.import_windows_cert.outputs.thumbprint }}"
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUrl
              }
            }
          }

          $configPath = "src-tauri/tauri.release.signing.conf.json"
          $signingConfig | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $configPath -Encoding utf8
          "args=--config $configPath" >> $env:GITHUB_OUTPUT

      - name: Build and upload release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: Workduck ${{ steps.release.outputs.tag }}
          releaseBody: "Windows installer build. Auto-update metadata is generated from the signed updater bundle. Installers are unsigned unless the release workflow reports that Windows code signing was enabled."
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ steps.signing_config.outputs.args }} -- --locked
